name: Verificar links

# Todas as segundas confirma que os links do README respondem.
# Se algum falhar, abre um aviso com a lista.
on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --timeout 30 --accept 200..=299,301,302,303,307,308,403,429 README.md PRIVACY.md
          output: lychee/relatorio.md
          fail: false
      - name: Abrir aviso se houver links partidos
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Links partidos no README
          content-filepath: lychee/relatorio.md
          labels: link-partido
